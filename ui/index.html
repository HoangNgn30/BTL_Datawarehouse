<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OLAP - Quản Lý Bán Hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #667eea;
            margin-bottom: 5px;
            font-size: 2em;
        }

        header p {
            color: #999;
            font-size: 0.95em;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        select, input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            grid-column: span 1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
            text-align: center;
            transition: transform 0.3s;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-card .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .summary-card .unit {
            color: #999;
            font-size: 0.9em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            height: 400px;
        }

        .chart-container h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.1em;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .chart-wrapper {
            position: relative;
            height: 100%;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 5px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 5px solid #3c3;
        }

        .loading {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📊 Dashboard OLAP - Quản Lý Bán Hàng</h1>
            <p>Phân tích dữ liệu từ 56 bảng Cuboid (SQL Server OLAP)</p>
        </header>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="control-group">
                <label for="cube-select">Chọn Khối (Cube):</label>
                <select id="cube-select">
                    <option value="sales">📈 Sales (Doanh Thu)</option>
                    <option value="inventory">📦 Inventory (Tồn Kho)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="chart-type">Loại Biểu Đồ:</label>
                <select id="chart-type">
                    <option value="by-month">Theo Tháng</option>
                    <option value="by-quarter">Theo Quý</option>
                    <option value="by-year">Theo Năm</option>
                    <option value="by-product">Theo Sản Phẩm (TOP 20)</option>
                    <option value="by-store">Theo Cửa Hàng (TOP 20)</option>
                    <option value="by-city">Theo Thành Phố (TOP 15)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="year-filter">Lọc Năm (Sales):</label>
                <input type="number" id="year-filter" placeholder="Nhập năm" min="2020" max="2024" value="2023">
            </div>

            <div class="control-group" style="grid-column: span 1;">
                <button onclick="loadChart()">🔄 Tải Dữ Liệu</button>
            </div>
        </div>

        <!-- SUMMARY -->
        <div class="summary" id="summary-container"></div>

        <!-- CHARTS -->
        <div class="charts-grid">
            <div class="chart-container">
                <h3>Biểu Đồ Chính</h3>
                <div class="chart-wrapper">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h3>Tổng Hợp (Dòng Phụ)</h3>
                <div class="chart-wrapper">
                    <canvas id="secondaryChart"></canvas>
                </div>
            </div>
        </div>

        <footer>
            © 2026 PTIT - Data Warehouse & Data Mining | Backend FastAPI + SQL Server OLAP
        </footer>
    </div>

    <script>
        let mainChart = null;
        let secondaryChart = null;

        // =====================================================
        // UTILITY FUNCTIONS
        // =====================================================

        function formatCurrency(value) {
            if (!value) return '0 VNĐ';
            if (value >= 1e9) {
                return (value / 1e9).toFixed(2) + ' Tỷ VNĐ';
            } else if (value >= 1e6) {
                return (value / 1e6).toFixed(2) + ' Triệu VNĐ';
            } else {
                return new Intl.NumberFormat('vi-VN').format(value) + ' VNĐ';
            }
        }

        function showError(message) {
            const container = document.getElementById('summary-container');
            container.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        function destroyCharts() {
            if (mainChart) mainChart.destroy();
            if (secondaryChart) secondaryChart.destroy();
        }

        async function fetchData(endpoint) {
            try {
                const response = await fetch(`http://127.0.0.1:8000${endpoint}`);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                showError(`Không thể kết nối API: ${error.message}`);
                throw error;
            }
        }

        // =====================================================
        // LOAD SUMMARY
        // =====================================================

        async function loadSummary() {
            const cube = document.getElementById('cube-select').value;
            const container = document.getElementById('summary-container');

            try {
                container.innerHTML = '<div class="loading">Đang tải...</div>';

                let salesTotal = null;
                let inventoryTotal = null;

                if (cube === 'sales') {
                    salesTotal = await fetchData('/api/summary/sales-total');
                } else {
                    inventoryTotal = await fetchData('/api/summary/inventory-total');
                }

                let html = '';

                if (salesTotal) {
                    html += `
                        <div class="summary-card">
                            <h3>💰 Tổng Doanh Thu</h3>
                            <div class="value">${formatCurrency(salesTotal.sum_amount)}</div>
                            <div class="unit">Từ tất cả đơn bán hàng</div>
                        </div>
                        <div class="summary-card">
                            <h3>📦 Tổng Số Lượng Bán</h3>
                            <div class="value">${new Intl.NumberFormat('vi-VN').format(salesTotal.total_quantity)}</div>
                            <div class="unit">Sản phẩm đã bán</div>
                        </div>
                    `;
                } else if (inventoryTotal) {
                    html += `
                        <div class="summary-card">
                            <h3>📦 Tổng Tồn Kho</h3>
                            <div class="value">${new Intl.NumberFormat('vi-VN').format(inventoryTotal.total_quantity_on_hand)}</div>
                            <div class="unit">Sản phẩm còn lại trong hệ thống</div>
                        </div>
                    `;
                }

                container.innerHTML = html || '<div class="error">Không có dữ liệu</div>';
            } catch (error) {
                // Lỗi đã được xử lý trong showError
            }
        }

        // =====================================================
        // LOAD CHART LOGIC
        // =====================================================

        async function loadChart() {
            const cube = document.getElementById('cube-select').value;
            const chartType = document.getElementById('chart-type').value;
            const year = document.getElementById('year-filter').value;

            destroyCharts();
            await loadSummary();

            try {
                let endpoint = '';
                let data = [];

                if (cube === 'sales') {
                    switch (chartType) {
                        case 'by-month':
                            endpoint = year ? `/api/sales/by-month?year=${year}` : '/api/sales/by-month';
                            data = await fetchData(endpoint);
                            renderSalesMonthChart(data);
                            break;
                        case 'by-quarter':
                            endpoint = year ? `/api/sales/by-quarter?year=${year}` : '/api/sales/by-quarter';
                            data = await fetchData(endpoint);
                            renderSalesQuarterChart(data);
                            break;
                        case 'by-year':
                            data = await fetchData('/api/sales/by-year');
                            renderSalesYearChart(data);
                            break;
                        case 'by-product':
                            data = await fetchData('/api/sales/by-product');
                            renderSalesProductChart(data.slice(0, 20));
                            break;
                        case 'by-store':
                            showError('Loại biểu đồ này chỉ có cho Inventory Cube');
                            break;
                    }
                } else if (cube === 'inventory') {
                    switch (chartType) {
                        case 'by-month':
                            endpoint = year ? `/api/inventory/by-month?year=${year}` : '/api/inventory/by-month';
                            data = await fetchData(endpoint);
                            renderInventoryMonthChart(data);
                            break;
                        case 'by-product':
                            data = await fetchData('/api/inventory/by-product');
                            renderInventoryProductChart(data.slice(0, 20));
                            break;
                        case 'by-store':
                            data = await fetchData('/api/inventory/by-store');
                            renderInventoryStoreChart(data.slice(0, 20));
                            break;
                        case 'by-city':
                            data = await fetchData('/api/inventory/by-city');
                            renderInventoryCityChart(data.slice(0, 15));
                            break;
                        case 'by-quarter':
                            data = await fetchData('/api/inventory/by-month');
                            renderInventoryQuarterChart(data);
                            break;
                        case 'by-year':
                            data = await fetchData('/api/inventory/by-month');
                            renderInventoryYearChart(data);
                            break;
                    }
                }
            } catch (error) {
                showError('Lỗi khi tải biểu đồ');
            }
        }

        // =====================================================
        // CHART RENDER FUNCTIONS
        // =====================================================

        function renderSalesMonthChart(data) {
            const labels = data.map(d => `T${d.month}/${d.year}`);
            const amounts = data.map(d => d.sum_amount || 0);
            const quantities = data.map(d => d.total_quantity || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Doanh Thu (VNĐ)',
                        data: amounts,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        yAxisID: 'y'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true }
                    },
                    scales: {
                        y: {
                            ticks: {
                                callback: v => formatCurrency(v)
                            }
                        }
                    }
                }
            });

            const ctx2 = document.getElementById('secondaryChart').getContext('2d');
            secondaryChart = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Số Lượng Bán',
                        data: quantities,
                        borderColor: 'rgba(118, 75, 162, 1)',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } }
                }
            });
        }

        function renderSalesQuarterChart(data) {
            const labels = data.map(d => `Q${d.quarter}/${d.year}`);
            const amounts = data.map(d => d.sum_amount || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Doanh Thu Theo Quý',
                        data: amounts,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } }
                }
            });
        }

        function renderSalesYearChart(data) {
            const labels = data.map(d => d.year.toString());
            const amounts = data.map(d => d.sum_amount || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Doanh Thu Theo Năm',
                        data: amounts,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderSalesProductChart(data) {
            const labels = data.map(d => d.product_key);
            const amounts = data.map(d => d.sum_amount || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: amounts,
                        backgroundColor: [
                            '#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe',
                            '#43e97b', '#fa709a', '#fee140', '#30b0fe', '#a8edea'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryMonthChart(data) {
            const labels = data.map(d => `T${d.month}/${d.year}`);
            const quantities = data.map(d => d.total_quantity_on_hand || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'area',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Tháng',
                        data: quantities,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryProductChart(data) {
            const labels = data.map(d => d.product_key);
            const quantities = data.map(d => d.total_quantity_on_hand || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Sản Phẩm (TOP 20)',
                        data: quantities,
                        backgroundColor: '#764ba2'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryStoreChart(data) {
            const labels = data.map(d => `CH ${d.store_key}`);
            const quantities = data.map(d => d.total_quantity_on_hand || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Cửa Hàng (TOP 20)',
                        data: quantities,
                        backgroundColor: '#f093fb'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryCityChart(data) {
            const labels = data.map(d => d.ten_tp);
            const quantities = data.map(d => d.total_quantity_on_hand || 0);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Thành Phố (TOP 15)',
                        data: quantities,
                        backgroundColor: '#4facfe'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryQuarterChart(data) {
            // Nhóm lại theo quý
            const quarterly = {};
            data.forEach(d => {
                const key = `Q${d.quarter}/${d.year}`;
                quarterly[key] = (quarterly[key] || 0) + (d.total_quantity_on_hand || 0);
            });

            const labels = Object.keys(quarterly);
            const quantities = Object.values(quarterly);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Quý',
                        data: quantities,
                        borderColor: '#764ba2',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        borderWidth: 3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderInventoryYearChart(data) {
            // Nhóm lại theo năm
            const yearly = {};
            data.forEach(d => {
                yearly[d.year] = (yearly[d.year] || 0) + (d.total_quantity_on_hand || 0);
            });

            const labels = Object.keys(yearly).sort();
            const quantities = labels.map(y => yearly[y]);

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tồn Kho Theo Năm',
                        data: quantities,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // =====================================================
        // INITIALIZE
        // =====================================================

        document.addEventListener('DOMContentLoaded', () => {
            loadChart();
            document.getElementById('cube-select').addEventListener('change', loadChart);
            document.getElementById('chart-type').addEventListener('change', loadChart);
        });
    </script>
</body>
</html>
